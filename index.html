<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オカウン PT計算機</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131e;
    --card2: #1a1a28;
    --accent: #00d9ff;
    --accent2: #e05c2a;
    --green: #2a8659;
    --text: #f0ede8;
    --muted: #555566;
    --glow: rgba(0, 217, 255, 0.3);
    --glow-green: rgba(42, 134, 89, 0.3);
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'メイリオ', Meiryo, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 48px;
  }
  
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,217,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,217,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }
  
  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  
  .header { text-align: center; padding: 8px 0 4px; }
  .header h1 {
    font-size: 36px;
    font-weight: 900;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-shadow: 0 0 30px var(--glow);
    line-height: 1;
  }
  .header .sub { font-size: 11px; color: var(--muted); letter-spacing: 0.15em; margin-top: 6px; }
  
  .card {
    background: var(--surface);
    border: 1px solid rgba(0, 217, 255, 0.15);
    border-radius: 6px;
    padding: 24px;
    box-shadow: 0 4px 40px rgba(0,0,0,0.5);
  }
  
  .card-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  
  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 24px;
    border: 1px solid rgba(0, 217, 255, 0.2);
    border-radius: 4px;
    overflow: hidden;
  }
  
  .tab {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: 'メイリオ', Meiryo, sans-serif;
    font-size: 13px;
    font-weight: 700;
    padding: 12px 8px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }
  .tab.active {
    background: rgba(0, 217, 255, 0.12);
    color: var(--accent);
  }
  .tab:not(:last-child) { border-right: 1px solid rgba(0, 217, 255, 0.2); }
  
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }
  
  .coin-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
    perspective: 600px;
  }
  
  .coin-inner {
    width: 110px;
    height: 110px;
    position: relative;
    transform-style: preserve-3d;
  }
  
  .coin-inner.flipping {
    animation: coinFlip 0.1s linear infinite;
  }
  @keyframes coinFlip {
    0%   { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
  }
  
  .coin-face {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    position: absolute;
    top: 0; left: 0;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    border: 4px solid #b0b0b0;
    transition: box-shadow 0.4s;
    background: radial-gradient(circle at 35% 32%, #f5f5f5, #d0d0d0 55%, #888888);
  }
  
  .coin-back-face {
    transform: rotateY(180deg);
    background: radial-gradient(circle at 35% 32%, #e8e8e8, #c0c0c0 55%, #777777);
    border-color: #a0a0a0;
  }
  
  .coin-face.lit {
    box-shadow: 0 0 36px rgba(0,217,255,0.75), 0 0 60px rgba(0,217,255,0.3);
  }
  .coin-back-face.lit {
    box-shadow: 0 0 36px rgba(224,92,42,0.65), 0 0 60px rgba(224,92,42,0.25);
    border-color: #c07020;
  }
  
  .coin-kanji {
    font-family: 'メイリオ', Meiryo, sans-serif;
    font-size: 38px;
    font-weight: 900;
    color: #5a3800;
    text-shadow: 0 2px 4px rgba(255,220,80,0.5), 0 -1px 2px rgba(0,0,0,0.3);
    line-height: 1;
    user-select: none;
  }
  
  .coin-sub {
    font-size: 9px;
    font-weight: 700;
    color: #7a5200;
    letter-spacing: 0.15em;
    margin-top: 2px;
    user-select: none;
  }
  
  .log-scroll {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-height: 72px;
    overflow-y: auto;
    margin-bottom: 16px;
    min-height: 32px;
  }
  
  .log-chip {
    padding: 4px 10px;
    border-radius: 3px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.05em;
    animation: popIn 0.2s ease;
  }
  .log-chip.h { background: rgba(0,217,255,0.12); border: 1px solid rgba(0,217,255,0.3); color: var(--accent); }
  .log-chip.t { background: rgba(224,92,42,0.12); border: 1px solid rgba(224,92,42,0.3); color: var(--accent2); }
  @keyframes popIn { from { opacity:0; transform: scale(0.7); } to { opacity:1; transform: scale(1); } }
  
  .speed-row { display: flex; gap: 8px; margin-bottom: 14px; }
  
  .speed-btn {
    flex: 1;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 3px;
    color: var(--muted);
    font-family: 'メイリオ', Meiryo, sans-serif;
    font-size: 12px;
    font-weight: 700;
    padding: 8px 4px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .speed-btn.active { background: rgba(0, 217, 255, 0.1); border-color: rgba(0, 217, 255, 0.4); color: var(--accent); }
  
  .btn-primary {
    width: 100%;
    background: var(--accent);
    border: none;
    border-radius: 4px;
    color: #0a0a0f;
    font-family: 'メイリオ', Meiryo, sans-serif;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 0.08em;
    padding: 15px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s, box-shadow 0.2s;
    box-shadow: 0 0 20px var(--glow);
  }
  .btn-primary:hover { background: #00e8ff; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { background: #2a2a3a; color: #444; box-shadow: none; cursor: not-allowed; }
  
  .manual-label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 10px;
  }
  
  .formula-badge {
    display: inline-block;
    background: rgba(0, 217, 255, 0.08);
    border: 1px dashed rgba(0, 217, 255, 0.3);
    border-radius: 4px;
    padding: 10px 16px;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.05em;
    margin-bottom: 20px;
    width: 100%;
    text-align: center;
  }
  
  .input-row {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }
  
  input[type="number"] {
    flex: 1;
    background: #0a0a0f;
    border: 1px solid rgba(0, 217, 255, 0.25);
    border-radius: 4px;
    color: var(--text);
    font-size: 26px;
    font-family: 'メイリオ', Meiryo, sans-serif;
    font-weight: 900;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    -moz-appearance: textfield;
  }
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
  input[type="number"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 14px var(--glow);
  }
  
  .btn-calc-inline {
    background: var(--accent);
    border: none;
    border-radius: 4px;
    color: #0a0a0f;
    font-family: 'メイリオ', Meiryo, sans-serif;
    font-size: 14px;
    font-weight: 900;
    padding: 0 20px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  .btn-calc-inline:hover { background: #00e8ff; }
  .btn-calc-inline:active { transform: scale(0.97); }
  
  .result-card {
    background: var(--card2);
    border: 1px solid rgba(0, 217, 255, 0.25);
    border-radius: 6px;
    padding: 24px;
    text-align: center;
    display: none;
  }
  .result-card.show { display: block; animation: fadeUp 0.4s ease; }
  @keyframes fadeUp { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }
  
  .r-label { font-size: 10px; letter-spacing: 0.18em; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
  .r-wins { font-size: 64px; font-weight: 900; color: var(--green); line-height: 1; text-shadow: 0 0 28px var(--glow-green); }
  .r-wins-unit { font-size: 14px; color: var(--muted); margin-bottom: 16px; }
  .divider { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 16px 0; }
  .r-pt-label { font-size: 10px; letter-spacing: 0.18em; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
  .r-pt-value { font-size: 52px; font-weight: 900; color: var(--accent); line-height: 1; text-shadow: 0 0 24px var(--glow); }
  .r-pt-formula { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; margin-top: 4px; }
  
  .manual-result {
    background: #0a0a0f;
    border: 1px solid rgba(0,217,255,0.15);
    border-radius: 4px;
    padding: 20px;
    text-align: center;
    margin-top: 16px;
    display: none;
    animation: fadeUp 0.3s ease;
  }
  .manual-result.show { display: block; }
  
  .mr-pt { font-size: 56px; font-weight: 900; color: var(--accent); line-height: 1; text-shadow: 0 0 20px var(--glow); }
  .mr-formula { font-size: 12px; color: var(--muted); margin-top: 4px; }
  
  .history-card { display: none; }
  .history-card.show { display: block; }
  
  .history-list { display: flex; flex-direction: column; gap: 8px; }
  
  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 4px;
    padding: 10px 14px;
    font-size: 13px;
    animation: fadeUp 0.3s ease;
  }
  
  .hi-left { color: var(--muted); font-size: 11px; }
  .hi-tag { font-size: 10px; padding: 2px 6px; border-radius: 2px; margin-right: 6px; font-weight: 700; }
  .hi-tag.sim { background: rgba(42,134,89,0.15); color: var(--green); }
  .hi-tag.manual { background: rgba(0,217,255,0.12); color: var(--accent); }
  
  .hi-wins { color: var(--green); font-weight: 900; font-size: 15px; }
  .hi-pt { color: var(--accent); font-weight: 900; font-size: 15px; }
  
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
  
  .input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  
  .input-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <h1>PT 計算機</h1>
    <div class="sub">オカウン P/T シミュレーター</div>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('sim', this)">🪙 コイン投げ</button>
      <button class="tab" onclick="switchTab('single', this)">🎰 1回投げ</button>
      <button class="tab" onclick="switchTab('multiple', this)">🎲 複数枚投げ</button>
      <button class="tab" onclick="switchTab('manual', this)">✏️ 手動入力</button>
    </div>

    <div class="tab-pane active" id="pane-sim">
      <div class="coin-wrap">
        <div class="coin-inner" id="coin">
          <div class="coin-face" id="coinFront">
            <div class="coin-kanji">表</div>
            <div class="coin-sub">HEADS</div>
          </div>
          <div class="coin-face coin-back-face" id="coinBack">
            <div class="coin-kanji">裏</div>
            <div class="coin-sub">TAILS</div>
          </div>
        </div>
      </div>
      
      <div class="log-scroll" id="logScroll"></div>

      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px; padding: 12px; background: rgba(255,255,255,0.02); border: 1px solid rgba(0, 217, 255, 0.15); border-radius: 4px;">
        <input type="checkbox" id="clarkCheckbox" style="width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent);">
        <label for="clarkCheckbox" style="cursor: pointer; font-size: 13px; font-weight: 700; color: var(--text); letter-spacing: 0.05em; margin: 0; flex: 1;">クラークモード</label>
      </div>

      <div class="speed-row">
        <button class="speed-btn active" onclick="setSpeed('slow',this)">ゆっくり</button>
        <button class="speed-btn" onclick="setSpeed('fast',this)">はやい</button>
        <button class="speed-btn" onclick="setSpeed('instant',this)">即結果</button>
      </div>

      <button class="btn-primary" id="simBtn" onclick="startSim()">コインを投げる</button>
    </div>

    <div class="tab-pane" id="pane-single">
      <div class="coin-wrap">
        <div class="coin-inner" id="coinSingle">
          <div class="coin-face" id="coinFrontSingle">
            <div class="coin-kanji">表</div>
            <div class="coin-sub">HEADS</div>
          </div>
          <div class="coin-face coin-back-face" id="coinBackSingle">
            <div class="coin-kanji">裏</div>
            <div class="coin-sub">TAILS</div>
          </div>
        </div>
      </div>

      <button class="btn-primary" id="singleBtn" onclick="startSingleFlip()" style="margin-bottom: 16px;">コインを投げる</button>

      <div class="result-card" id="singleResultCard" style="display: none;">
        <div class="r-label">結果</div>
        <div class="r-wins" id="singleResultText">表</div>
        <div class="r-wins-unit" id="singleResultEn">HEADS</div>
      </div>
    </div>

    <div class="tab-pane" id="pane-multiple">
      <div class="input-group" style="margin-bottom: 20px;">
        <label class="input-label">投げるコインの枚数</label>
        <input type="number" id="multipleCount" value="5" min="1" max="1000" />
      </div>

      <button class="btn-primary" id="multipleBtn" onclick="startMultipleFlip()" style="margin-bottom: 16px;">コインを投げる</button>

      <div class="result-card" id="multipleResultCard" style="display: none;">
        <div class="r-label">表が出た枚数</div>
        <div class="r-wins" id="multipleHeadsCount">0</div>
        <div class="r-wins-unit">枚 / <span id="multipleTotalCount">5</span>枚</div>
        <hr class="divider">
        <div class="r-pt-label">詳細</div>
        <div style="font-size: 12px; color: var(--muted); margin-top: 8px;">
          <div>表: <span id="multipleHeadsDetail" style="color: var(--accent); font-weight: 700;">0</span>枚</div>
          <div>裏: <span id="multipleTailsDetail" style="color: var(--accent2); font-weight: 700;">0</span>枚</div>
        </div>
      </div>
    </div>

    <div class="tab-pane" id="pane-manual">
      <div class="formula-badge">P / T = 3 × 2 ^ c</div>
      <label class="manual-label">コイン投げに勝った回数 (c)</label>
      <div class="input-row">
        <input type="number" id="manualInput" min="0" max="99" placeholder="0" />
        <button class="btn-calc-inline" onclick="calcManual()">計算</button>
      </div>
      <div class="manual-result" id="manualResult">
        <div class="r-pt-label">P / T</div>
        <div class="mr-pt" id="mrPt">—</div>
        <div class="mr-formula" id="mrFormula"></div>
      </div>
    </div>
  </div>

  <div class="result-card" id="resultCard">
    <div class="r-label">連続で表が出た回数</div>
    <div class="r-wins" id="rWins">0</div>
    <div class="r-wins-unit">回</div>
    <hr class="divider">
    <div class="r-pt-label">P / T</div>
    <div class="r-pt-value" id="rPt">3</div>
    <div class="r-pt-formula" id="rFormula"></div>
  </div>

  <div class="card history-card" id="historyCard">
    <div class="card-title">履歴（直近5件）</div>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<script>
  let speed = 'slow';
  let running = false;
  const history = [];

  function switchTab(id, btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('pane-' + id).classList.add('active');
    
    if (id !== 'sim') {
      document.getElementById('resultCard').classList.remove('show');
      document.getElementById('historyCard').classList.remove('show');
    }
  }

  function setSpeed(s, btn) {
    speed = s;
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function startSingleFlip() {
    const coinInner = document.getElementById('coinSingle');
    const front = document.getElementById('coinFrontSingle');
    const back = document.getElementById('coinBackSingle');
    const btn = document.getElementById('singleBtn');

    front.classList.remove('lit');
    back.classList.remove('lit');
    btn.disabled = true;
    document.getElementById('singleResultCard').style.display = 'none';

    coinInner.classList.add('flipping');

    setTimeout(() => {
      coinInner.classList.remove('flipping');
      const isHeads = Math.random() < 0.5;

      if (isHeads) {
        front.classList.add('lit');
        document.getElementById('singleResultText').textContent = '表';
        document.getElementById('singleResultEn').textContent = 'HEADS';
      } else {
        back.classList.add('lit');
        document.getElementById('singleResultText').textContent = '裏';
        document.getElementById('singleResultEn').textContent = 'TAILS';
      }

      document.getElementById('singleResultCard').style.display = 'block';
      btn.disabled = false;
    }, 600);
  }

  function startMultipleFlip() {
    const count = parseInt(document.getElementById('multipleCount').value) || 5;
    const btn = document.getElementById('multipleBtn');

    btn.disabled = true;
    document.getElementById('multipleResultCard').style.display = 'none';

    setTimeout(() => {
      let headsCount = 0;
      for (let i = 0; i < count; i++) {
        if (Math.random() < 0.5) {
          headsCount++;
        }
      }

      const tailsCount = count - headsCount;

      document.getElementById('multipleHeadsCount').textContent = headsCount;
      document.getElementById('multipleTotalCount').textContent = count;
      document.getElementById('multipleHeadsDetail').textContent = headsCount;
      document.getElementById('multipleTailsDetail').textContent = tailsCount;
      document.getElementById('multipleResultCard').style.display = 'block';

      btn.disabled = false;
    }, 300);
  }

  function startSim() {
    if (running) return;
    running = true;
    document.getElementById('simBtn').disabled = true;
    document.getElementById('resultCard').classList.remove('show');
    document.getElementById('logScroll').innerHTML = '';

    const isClarkMode = document.getElementById('clarkCheckbox').checked;

    if (isClarkMode) {
      startClarkMode();
    } else {
      startNormalMode();
    }
  }

  function startNormalMode() {
    const coinInner = document.getElementById('coin');
    const front = document.getElementById('coinFront');
    const back = document.getElementById('coinBack');
    front.classList.remove('lit');
    back.classList.remove('lit');

    if (speed === 'instant') {
      let wins = 0;
      while (Math.random() < 0.5) wins++;
      showSimResult(wins);
      return;
    }

    const flipDur   = speed === 'slow' ? 480 : 150;
    const pauseDur  = speed === 'slow' ? 380 : 120;
    let wins = 0;

    function throwOne() {
      front.classList.remove('lit');
      back.classList.remove('lit');
      coinInner.classList.add('flipping');
      setTimeout(() => {
        coinInner.classList.remove('flipping');
        const isHeads = Math.random() < 0.5;
        if (isHeads) {
          front.classList.add('lit');
          addChip('表', 'h');
          wins++;
          setTimeout(throwOne, pauseDur);
        } else {
          back.classList.add('lit');
          addChip('裏', 't');
          setTimeout(() => showSimResult(wins), pauseDur);
        }
      }, flipDur);
    }
    throwOne();
  }

  function startClarkMode() {
    const coinInner = document.getElementById('coin');
    const front = document.getElementById('coinFront');
    const back = document.getElementById('coinBack');

    if (speed === 'instant') {
      let wins = 0;
      while (true) {
        const coin1 = Math.random() < 0.5;
        const coin2 = Math.random() < 0.5;
        if (coin1 && coin2) {
          wins++;
        } else if (!coin1 && !coin2) {
          break;
        } else {
          wins++;
        }
      }
      showSimResult(wins);
      return;
    }

    const flipDur  = speed === 'slow' ? 480 : 150;
    const pauseDur = speed === 'slow' ? 380 : 120;
    let wins = 0;

    function throwPair() {
      front.classList.remove('lit');
      back.classList.remove('lit');
      coinInner.classList.add('flipping');
      
      setTimeout(() => {
        coinInner.classList.remove('flipping');
        
        const coin1 = Math.random() < 0.5;
        const coin2 = Math.random() < 0.5;
        
        let result1 = coin1 ? '表' : '裏';
        let result2 = coin2 ? '表' : '裏';
        
        addChip(result1, coin1 ? 'h' : 't');
        addChipWithBreak(result2, coin2 ? 'h' : 't');
        
        if (coin1 && coin2) {
          front.classList.add('lit');
          wins++;
          setTimeout(throwPair, pauseDur);
        } else if ((!coin1 && !coin2)) {
          back.classList.add('lit');
          setTimeout(() => showSimResult(wins), pauseDur);
        } else {
          if (coin1) {
            front.classList.add('lit');
          } else {
            back.classList.add('lit');
          }
          wins++;
          setTimeout(throwPair, pauseDur);
        }
      }, flipDur);
    }
    throwPair();
  }

  function addChip(text, cls) {
    const scroll = document.getElementById('logScroll');
    const chip = document.createElement('span');
    chip.className = `log-chip ${cls}`;
    chip.textContent = text;
    scroll.appendChild(chip);
    scroll.scrollTop = scroll.scrollHeight;
  }

  function addChipWithBreak(text, cls) {
    const scroll = document.getElementById('logScroll');
    const chip = document.createElement('span');
    chip.className = `log-chip ${cls}`;
    chip.textContent = text;
    scroll.appendChild(chip);
    
    const br = document.createElement('br');
    scroll.appendChild(br);
    
    scroll.scrollTop = scroll.scrollHeight;
  }

  function showSimResult(wins) {
    const pt = 3 * Math.pow(2, wins);
    document.getElementById('rWins').textContent = wins;
    document.getElementById('rPt').textContent = `${pt.toLocaleString()} / ${pt.toLocaleString()}`;
    document.getElementById('rFormula').textContent = `3 × 2^${wins} = ${pt.toLocaleString()}`;
    document.getElementById('resultCard').classList.add('show');
    addHistory(wins, pt, 'sim');

    document.getElementById('simBtn').disabled = false;
    document.getElementById('simBtn').textContent = 'もう一回投げる';
    running = false;
  }

  function calcManual() {
    const input = document.getElementById('manualInput');
    const val = input.value.trim();
    
    if (val === '' || isNaN(val) || parseInt(val) < 0) {
      input.style.animation = 'none';
      input.offsetHeight;
      input.style.animation = 'shake 0.3s ease';
      setTimeout(() => input.style.animation = '', 300);
      return;
    }
    
    const c = parseInt(val);
    const pt = 3 * Math.pow(2, c);
    
    document.getElementById('mrPt').textContent = `${pt.toLocaleString()} / ${pt.toLocaleString()}`;
    document.getElementById('mrFormula').textContent = `3 × 2^${c} = ${pt.toLocaleString()}`;
    document.getElementById('manualResult').classList.add('show');
    addHistory(c, pt, 'manual');
  }

  document.getElementById('manualInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') calcManual();
  });

  function addHistory(wins, pt, type) {
    history.unshift({ wins, pt, type });
    if (history.length > 5) history.pop();
    
    const list = document.getElementById('historyList');
    list.innerHTML = history.map((h, i) => `
      <div class="history-item">
        <span class="hi-left">
          <span class="hi-tag ${h.type}">${h.type === 'sim' ? 'シム' : '手動'}</span>
          #${i + 1}
        </span>
        <span class="hi-wins">${h.wins}回</span>
        <span class="hi-pt">P/T ${h.pt.toLocaleString()}</span>
      </div>`).join('');
    document.getElementById('historyCard').classList.add('show');
  }
</script>

</body>
</html>
